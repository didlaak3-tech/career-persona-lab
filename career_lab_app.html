            // 1차시 진로 강점 유형 자동 도출 로직 (8문항 기반)
            // ========================================================================
            const derivedTypeKey = useMemo(() => {
                const ans = data.step1.answers || {};

                    if (v === 'P') pCount++;
                    if (v === 'T') tCount++;
                    if (v === 'C') cCount++;
                    if (v === 'S') sCount++;
                    if (v === 'H') hCount++;
                    if (v === 'I') iCount++;
                });
                const dim1 = pCount >= tCount ? 'P' : 'T';
                const dim2 = cCount >= sCount ? 'C' : 'S';
                const dim3 = hCount >= iCount ? 'H' : 'I';
                return `${dim1}${dim2}${dim3}`;
            }, [data.step1.answers]);

            const myCareerProfile = derivedTypeKey ? CAREER_TYPES[derivedTypeKey] : null;
            const myTargetJob = data.step1.customJob || data.step1.selectedJob || (myCareerProfile ? myCareerProfile.recommendedFields[0] : '나의 관심 진로 분야');

            // ========================================================================
            // 2차시 5단계 심층 인터뷰 AI 시나리오 응답 생성기
            // ========================================================================
            const INTERVIEW_PROMPTS = [

                },
                {
                    step: 2,
                    btnText: '질문 2: 이 분야에서 일할 때 가장 중요한 핵심 역량과 태도는 뭐야?',

                    getReply: (job) => `'${job}' 분야에서 일해보니 크게 두 가지가 정말 중요하더라. 첫째는 기본적인 교과 지식과 데이터를 정확하게 읽어내는 '기초 문해력'이고, 둘째는 인공지능이 대신할 수 없는 '따뜻한 공감과 문제 발견 능력'이야! 정답만 외우기보다 "왜 그럴까?", "어떻게 하면 더 좋아질까?"라고 스스로 질문하는 태도가 가장 큰 차이를 만들어. 혹시 내가 일하면서 겪었던 힘든 순간이나 극복 방법이 궁금하지 않니?`

                    step: 3,

                    sampleQuestion: '전문가로 성장하면서 가장 힘들었던 순간은 언제였고, 어떻게 극복했어?',
                    getReply: (job) => `솔직히 처음부터 모든 게 완벽하진 않았어. 예상치 못한 기술 변화나 프로젝트 실패로 자신감이 떨어졌던 적도 있었거든. 하지만 그럴 때마다 실패 원인을 차분히 기록하고, 동료들과 솔직하게 피드백을 주고받으며 하나씩 수정해 나갔어. 고등학교 수행평가나 모둠 활동에서 친구들과 의견을 맞추고 끝까지 결과물을 완성해 봤던 경험이 위기를 버티는 단단한 근육이 되어주었단다!`

                    getReply: (job) => `2036년에는 단순 반복 작업이나 기초 자료 정리는 AI가 거의 다 도와주고 있어! 그래서 오히려 인간 전문가인 우리는 '윤리적 판단', '창의적인 융합 기획', 그리고 '사람의 마음을 어루만지는 깊은 소통'에 훨씬 더 집중하게 됐어. 한 분야만 아는 것보다 다양한 과목의 지식을 연결할 줄 아는 사람이 훨씬 환영받는 시대야!`

                    getReply: (job) => `거창한 스펙보다 지금 학교 수업을 네 진로와 연결해 보는 게 최고야! 수업 시간에 배운 개념 중 흥미로운 걸 골라 '${job}'의 시각에서 짧은 탐구 보고서를 써보거나, 관련된 책 한 권을 깊이 읽고 네 생각을 정리해 봐. 그리고 아래 [인터뷰 핵심 요약 노트] 3가지를 꼼꼼히 적어서 기록으로 남겨두면 너의 멋진 자산이 될 거야. 언제나 응원할게! ✨`

            const handleSendInterviewMessage = (customText) => {
                const queryText = (customText || data.step2.userInput || '').trim();

                const currentIdx = data.step2.scenarioIdx || 0;

                const s4Fields = [data.step4.projectTitle, data.step4.problemBackground, data.step4.targetAudience, data.step4.coreIdea, data.step4.actionStep1, data.step4.actionStep2, data.step4.expectedEffect];
                const filledS4 = s4Fields.filter(f => (f || '').trim().length >= 5).length;
                const p4 = Math.round((filledS4 / 7) * 100);

                // 5차시: 짝꿍 이름 + 서술형 4개 항목
                const s5Fields = [data.step5.peerName, data.step5.peerPraise, data.step5.peerQuestion, data.step5.myFinalRevision, data.step5.collaborationLesson];

                const s6Text = (data.step6.roadmapGrade1.length >= 10 ? 20 : 0) + (data.step6.roadmapGrade2.length >= 10 ? 20 : 0) + (data.step6.roadmapGrade3.length >= 10 ? 20 : 0) + (data.step6.finalReflection.length >= 25 ? 20 : 0);
                const p6 = Math.min(100, s6Subj + s6Text);

                return { 1: p1, 2: p2, 3: p3, 4: p4, 5: p5, 6: p6 };
            }, [data]);

            // ========================================================================
            // 1~6차시 전체 데이터 교차 분석 리포트 생성기 (자연스러운 종합 서술문)
            // ========================================================================
            const comprehensiveAnalysis = useMemo(() => {
                const profileName = myCareerProfile ? myCareerProfile.name : '자기주도적 탐구자';
                const strengthsText = myCareerProfile ? myCareerProfile.strengths[0] : '문제 해결력과 소통 능력';
                const currentCase = DILEMMA_CASES.find(c => c.id === data.step3.caseId) || DILEMMA_CASES[0];
                const linkedSubj = data.step3.linkedSubjects.length > 0 ? data.step3.linkedSubjects.join(', ') : '공통 교과';
                const grade2Subj = data.step6.selectedGrade2Subjects.length > 0
                    ? data.step6.selectedGrade2Subjects.join(', ')
                    : (myCareerProfile ? myCareerProfile.grade2Subjects.slice(0, 3).join(', ') : '진로 연계 선택과목');

                // 1. 진로 정체성 및 동기 융합 분석
                const identityAnalysis = `${studentName || '학생'}님은 진로 성향 진단 결과 '${profileName}'의 특성을 보이며, 특히 '${strengthsText}'에서 뛰어난 잠재력을 지니고 있습니다. 일상 속 경험(${data.step1.wsExperience || '교내 활동 및 모둠 협력 경험'})을 바탕으로 '${myTargetJob}' 분야에 구체적인 관심을 형성하였으며, 장차 '${data.step1.wsValue || '타인과 사회에 긍정적인 영향력을 전하는 전문가'}'로 성장하고자 하는 뚜렷한 가치관을 확립하고 있습니다.`;

                const academicAnalysis = `가상 멘토링 및 직무 분석을 통해 '${myTargetJob}' 직무의 핵심 업무(${data.step2.noteCoreWork || '현장 문제 진단 및 전문 솔루션 기획'})와 필수 역량(${data.step2.noteCompetency || '기초 문해력 및 공감적 소통 역량'})을 심층적으로 파악했습니다. 특히 '${currentCase.title}'라는 시사·윤리적 딜레마 상황에서 ${linkedSubj} 교과의 개념을 융합하여(${data.step3.subjectConnection || '교과 원리를 실생활 진로 이슈에 적용'}), '${data.step3.mySolution || '기술의 효율성과 인간 중심의 윤리적 가치를 조화시키는 대안'}'을 도출하는 우수한 비판적 사고력과 교과 응용력을 보여주었습니다.`;

            // ========================================================================

                            <p style="font-size:10.5pt; text-align:justify; margin-bottom:0;"><strong>4) 향후 학업 설계 종합 의견:</strong> ${comprehensiveAnalysis.futureRoadmap}</p>

                                        <span className="text-xs font-black text-purple-600">ACTIVITY 6-1 (맞춤형 진로 방향 컨설팅 가이드)</span>
                                        <h2 className="text-xl font-black text-slate-800 mt-0.5">
                                            나의 1~5차시 데이터 기반 ‘고등학교 진로 성장 방향 가이드’
                                        </h2>
                                        <p className="text-xs text-slate-500 mt-1">
                                            단순 답변 모음이 아니라, 내가 진단한 강점 유형과 관심 직무를 바탕으로 앞으로 고등학교에서 어떤 과목을 선택하고 어떤 활동을 심화하면 좋을지 구체적인 방향을 제시합니다.
                                        </p>
                                    </div>

                                    <div className="p-6 rounded-3xl bg-gradient-to-br from-indigo-950 via-purple-900 to-indigo-900 text-white space-y-5 shadow-lg">

                                            <div>
                                                <span className="px-3 py-1 rounded-full bg-amber-400 text-slate-950 text-xs font-black">
                                                    🌟 {studentName || '학생'}님을 위한 맞춤형 진로 네비게이션
                                                </span>
                                                <h3 className="text-lg md:text-xl font-black mt-2">
                                                    [{myCareerProfile ? myCareerProfile.name : '자기주도 탐구형'}] × [{myTargetJob}] 성장 로드맵 제안
                                                </h3>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                                            <div className="bg-white/10 p-4 rounded-2xl space-y-2.5 border border-white/10">
                                                <p className="font-black text-amber-300 text-sm">
                                                    📘 1. 2학년 추천 선택과목 가이드 (클릭하여 내 계획에 담기)
                                                </p>
                                                <p className="text-indigo-100 leading-relaxed">
                                                    ‘{myTargetJob}’ 분야로 나아가기 위해 2~3학년 선택과목에서 아래 과목들을 우선적으로 고려해 보세요!
                                                </p>
                                                <div className="flex flex-wrap gap-1.5 pt-1">
                                                    {(myCareerProfile ? myCareerProfile.grade2Subjects : ['사회·문화', '생활과 윤리', '생명과학Ⅰ', '확률과 통계', '정보', '심리학']).map(subj => {
                                                        const picked = data.step6.selectedGrade2Subjects.includes(subj);
                                                        return (
                                                            <button
                                                                key={subj}
                                                                onClick={() => {
                                                                    const next = picked
                                                                        ? data.step6.selectedGrade2Subjects.filter(s => s !== subj)
                                                                        : [...data.step6.selectedGrade2Subjects, subj];
                                                                    updateStepField('step6', 'selectedGrade2Subjects', next);
                                                                }}
                                                                className={`px-3 py-1.5 rounded-xl font-bold transition ${
                                                                    picked
                                                                        ? 'bg-amber-400 text-slate-950 shadow'
                                                                        : 'bg-white/15 hover:bg-white/25 text-white'
                                                                }`}
                                                            >
                                                                {picked ? `✓ ${subj}` : `+ ${subj}`}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>

                                            <div className="bg-white/10 p-4 rounded-2xl space-y-2 border border-white/10">
                                                <p className="font-black text-pink-300 text-sm">
                                                    🔬 2. 맞춤형 동아리 & 심화 탐구 활동 추천
                                                </p>
                                                <ul className="space-y-1.5 text-indigo-100 leading-relaxed">
                                                    {(myCareerProfile ? myCareerProfile.schoolActivities : [
                                                        '교과 수업 시간 배운 원리를 내 관심 진로 이슈와 연결해 심화 발표하기',
                                                        '4차시에 기획한 사회문제 해결 프로젝트를 동아리나 자율 탐구 보고서로 확장하기',
                                                        '진로 관련 전문 도서를 학기당 2권 이상 읽고 비판적 독서 노트 작성하기'
                                                    ]).map((act, i) => (
                                                        <li key={i}>• {act}</li>
                                                    ))}
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                </section>

                                {/* 6-2: 나의 고교 3개년 로드맵 및 최종 성찰 작성 (no-print) */}
                                <section className="space-y-4 pt-4 border-t no-print">
                                    <div>
                                        <span className="text-xs font-black text-indigo-600">ACTIVITY 6-2 (나의 실행 계획 수립)</span>
                                        <h3 className="text-lg font-black text-slate-800 mt-0.5">나의 고등학교 3개년 성장 로드맵 & 최종 소감문</h3>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                        <div className="p-4 rounded-2xl bg-purple-50/50 border border-purple-100 space-y-1.5">
                                            <label className="block text-xs font-black text-purple-900">🌱 1학년: 기초 탐색 및 습관 형성 계획</label>
                                            <textarea
                                                rows="3"
                                                placeholder="예: 공통 과목 수업에 충실히 참여하며 관심 분야의 기초 독서와 진로 신문 스크랩을 꾸준히 실천한다."
                                                value={data.step6.roadmapGrade1}
                                                onChange={(e) => updateStepField('step6', 'roadmapGrade1', e.target.value)}
                                                className="w-full p-2.5 border rounded-xl text-xs bg-white outline-none focus:ring-2 focus:ring-purple-400"
                                            />
                                        </div>
                                        <div className="p-4 rounded-2xl bg-purple-50/50 border border-purple-100 space-y-1.5">
                                            <label className="block text-xs font-black text-purple-900">🌿 2학년: 선택과목 이수 및 심화 탐구 계획</label>
                                            <textarea
                                                rows="3"
                                                placeholder="예: 진로 관련 선택과목을 수강하고, 동아리와 수업 발표에서 4차시 기획안을 발전시킨 심층 보고서를 작성한다."
                                                value={data.step6.roadmapGrade2}
                                                onChange={(e) => updateStepField('step6', 'roadmapGrade2', e.target.value)}
                                                className="w-full p-2.5 border rounded-xl text-xs bg-white outline-none focus:ring-2 focus:ring-purple-400"
                                            />
                                        </div>
                                        <div className="p-4 rounded-2xl bg-purple-50/50 border border-purple-100 space-y-1.5">
                                            <label className="block text-xs font-black text-purple-900">🌳 3학년: 진로 역량 완성 및 진학 준비</label>
                                            <textarea
                                                rows="3"
                                                placeholder="예: 1~2학년 탐구 활동을 종합하여 나만의 진로 포트폴리오를 완성하고 구체적인 진학·진로 목표를 실현한다."
                                                value={data.step6.roadmapGrade3}
                                                onChange={(e) => updateStepField('step6', 'roadmapGrade3', e.target.value)}
                                                className="w-full p-2.5 border rounded-xl text-xs bg-white outline-none focus:ring-2 focus:ring-purple-400"
                                            />
                                        </div>
                                    </div>

                                    <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-2">
                                        <label className="block text-xs md:text-sm font-extrabold text-slate-900">
                                            🌟 1~6차시 진로 탐구 여정을 마치며 느낀 점과 나의 성장 다짐 (최종 성찰문)
                                        </label>
                                        <textarea
                                            rows="3"
                                            placeholder="이번 6차시 활동을 통해 나에 대해 새롭게 발견한 점, 진로를 바라보는 시선의 변화, 앞으로의 다짐을 정성껏 작성해주세요."
                                            value={data.step6.finalReflection}
                                            onChange={(e) => updateStepField('step6', 'finalReflection', e.target.value)}
                                            className="w-full p-3 border rounded-xl text-xs md:text-sm bg-white outline-none focus:ring-2 focus:ring-purple-400 leading-relaxed"
                                        />
                                    </div>

                                    {/* 다운로드 및 PDF 저장 버튼 */}
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                                        <button
                                            onClick={downloadPdfDocument}
                                            disabled={isGeneratingPdf}
                                            className="py-4 px-6 bg-gradient-to-r from-rose-600 to-pink-600 text-white rounded-2xl font-black text-xs md:text-sm shadow-lg hover:opacity-95 transition flex items-center justify-center gap-2"
                                        >
                                            <span>{isGeneratingPdf ? '⏳ PDF 파일 생성 중...' : '📕 최종 진로 탐구 보고서(.pdf 파일) 바로 다운로드'}</span>
                                        </button>
                                        <button
                                            onClick={downloadWordDocument}
                                            className="py-4 px-6 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-2xl font-black text-xs md:text-sm shadow-lg hover:opacity-95 transition flex items-center justify-center gap-2"
                                        >
                                            <span>📄 최종 진로 탐구 보고서(.doc 워드 파일) 다운로드</span>
                                        </button>
                                    </div>
                                </section>

                                {/* ============================================================
                                    6-3: PDF 변환 및 제출용 완결형 종합 보고서 프리뷰
                                ============================================================ */}
                                <section id="printable-report-area" className="p-6 md:p-8 rounded-3xl bg-white border-2 border-indigo-200 space-y-6">
                                    <div className="border-b-2 border-indigo-900 pb-4 flex flex-col sm:flex-row justify-between sm:items-end gap-2">
                                        <div>
                                            <span className="text-[11px] font-black text-indigo-600">고등학교 1학년 진로 심화 탐구 포트폴리오</span>
                                            <h3 className="text-xl md:text-2xl font-black text-slate-900 mt-0.5">
                                                🎓 고등학교 1학년 진로 심화 탐구 종합 보고서
                                            </h3>
                                        </div>
                                        <div className="text-xs font-extrabold text-slate-700 bg-slate-50 px-4 py-2 rounded-xl border">
                                            학번: {studentId || '미입력'} &nbsp;|&nbsp; 이름: {studentName || '미입력'} ({avatar})
                                        </div>
                                    </div>

                                    {/* ★ 1~6차시 통합 교차 분석 섹션 (종합 진단 리포트) */}
                                    <div className="p-5 rounded-2xl bg-indigo-50/70 border border-indigo-200 space-y-3">
                                        <div className="flex items-center justify-between">
                                            <h4 className="text-sm font-black text-indigo-950">
                                                📊 [종합 진단] 1~6차시 진로 탐구 역량 및 성장 방향 분석
                                            </h4>
                                            <span className="text-[11px] font-bold text-indigo-700 bg-white px-2.5 py-0.5 rounded-full border border-indigo-200">
                                                {myCareerProfile ? myCareerProfile.name : '자기주도 탐구형'} × {myTargetJob}
                                            </span>
                                        </div>
                                        <div className="space-y-2 text-xs text-slate-800 leading-relaxed bg-white p-4 rounded-xl border border-indigo-100">
                                            <p><strong>• 진로 정체성 및 동기 분석:</strong> {comprehensiveAnalysis.identityAnalysis}</p>
                                            <p><strong>• 직무 이해 및 교과 융합 분석:</strong> {comprehensiveAnalysis.academicAnalysis}</p>
                                            <p><strong>• 실천적 문제해결 및 협업 분석:</strong> {comprehensiveAnalysis.projectAnalysis}</p>
                                            <p><strong>• 향후 학업 설계 종합 의견:</strong> {comprehensiveAnalysis.futureRoadmap}</p>
                                        </div>
                                    </div>

                                    {/* 차시별 상세 활동 기록 표 */}
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                                        <div className="bg-slate-50 p-4 rounded-2xl border space-y-1.5">
                                            <p className="font-black text-indigo-800 text-sm">1. 진로 강점 유형 및 탐색 동기</p>
                                            <p><strong>• 진단 유형:</strong> {myCareerProfile ? `${myCareerProfile.name} (${myCareerProfile.badge})` : '탐색 중'}</p>
                                            <p><strong>• 희망 진로 분야:</strong> {myTargetJob}</p>
                                            <p><strong>• 강점 발휘 경험:</strong> {data.step1.wsExperience || '-'}</p>
                                            <p><strong>• 관심 계기 및 추구 가치:</strong> {data.step1.wsReason || '-'} / {data.step1.wsValue || '-'}</p>
                                        </div>

                                        <div className="bg-slate-50 p-4 rounded-2xl border space-y-1.5">
                                            <p className="font-black text-indigo-800 text-sm">2. 2036 미래 멘토링 & 직무 분석</p>
                                            <p><strong>• 핵심 업무와 매력:</strong> {data.step2.noteCoreWork || '-'}</p>
                                            <p><strong>• 요구 역량과 태도:</strong> {data.step2.noteCompetency || '-'}</p>
                                            <p><strong>• 고1 학업 준비 다짐:</strong> {data.step2.noteHighSchool || '-'}</p>
                                        </div>

                                        <div className="bg-slate-50 p-4 rounded-2xl border space-y-1.5">
                                            <p className="font-black text-indigo-800 text-sm">3. 교과 연계 시사·윤리 딜레마 탐구</p>
                                            <p><strong>• 탐구 주제:</strong> {currentCaseObj.title}</p>
                                            <p><strong>• 연계 교과목:</strong> {data.step3.linkedSubjects.join(', ') || '-'}</p>
                                            <p><strong>• 교과 연계 분석:</strong> {data.step3.subjectConnection || '-'}</p>
                                            <p><strong>• 나만의 해결책:</strong> {data.step3.mySolution || '-'}</p>
                                        </div>

                                        <div className="bg-slate-50 p-4 rounded-2xl border space-y-1.5">
                                            <p className="font-black text-indigo-800 text-sm">4. 사회문제 해결 미니 프로젝트 기획</p>
                                            <p><strong>• 프로젝트명:</strong> {data.step4.projectTitle || '-'} (대상: {data.step4.targetAudience || '-'})</p>
                                            <p><strong>• 문제 배경:</strong> {data.step4.problemBackground || '-'}</p>
                                            <p><strong>• 핵심 아이디어:</strong> {data.step4.coreIdea || '-'}</p>
                                            <p><strong>• 실행 계획:</strong> ①{data.step4.actionStep1 || '-'} ➔ ②{data.step4.actionStep2 || '-'} ➔ ③{data.step4.actionStep3 || '-'}</p>
                                        </div>

                                        <div className="bg-slate-50 p-4 rounded-2xl border space-y-1.5">
                                            <p className="font-black text-indigo-800 text-sm">5. 동료 피드백 수용 및 기획 고도화</p>
                                            <p><strong>• 피드백 파트너:</strong> {data.step5.peerName || '-'}</p>
                                            <p><strong>• 동료 칭찬 및 질문:</strong> {data.step5.peerPraise || '-'} / {data.step5.peerQuestion || '-'}</p>
                                            <p><strong>• 최종 개선안(Revision):</strong> {data.step5.myFinalRevision || '-'}</p>
                                        </div>

                                        <div className="bg-slate-50 p-4 rounded-2xl border space-y-1.5">
                                            <p className="font-black text-indigo-800 text-sm">6. 맞춤형 선택과목 & 3개년 로드맵</p>
                                            <p><strong>• 2학년 희망 선택과목:</strong> {data.step6.selectedGrade2Subjects.join(', ') || (myCareerProfile ? myCareerProfile.grade2Subjects.join(', ') : '-')}</p>
                                            <p><strong>• 학년별 계획:</strong> [1학년] {data.step6.roadmapGrade1 || '-'} / [2학년] {data.step6.roadmapGrade2 || '-'} / [3학년] {data.step6.roadmapGrade3 || '-'}</p>
                                            <p><strong>• 최종 성찰:</strong> {data.step6.finalReflection || '-'}</p>
                                        </div>
                                    </div>
                                </section>
                            </div>
                        )}

                        {/* 하단 이전/다음 네비게이션 버튼 */}
                        <div className="flex justify-between items-center mt-8 pt-5 border-t border-slate-100 no-print">
                            <button
                                onClick={() => {
                                    setCurrentStep(prev => Math.max(prev - 1, 1));
                                    window.scrollTo({ top: 0, behavior: 'smooth' });
                                }}
                                disabled={currentStep === 1}
                                className={`px-5 py-2.5 rounded-xl text-xs md:text-sm font-black transition ${
                                    currentStep === 1 ? 'opacity-30 cursor-not-allowed bg-slate-100' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'
                                }`}
                            >
                                ← 이전 차시
                            </button>
                            <span className="text-xs font-extrabold text-slate-400">
                                {currentStep} / 6 차시 워크북
                            </span>
                            <button
                                onClick={() => {
                                    setCurrentStep(prev => Math.min(prev + 1, 6));
                                    window.scrollTo({ top: 0, behavior: 'smooth' });
                                }}
                                disabled={currentStep === 6}
                                className={`px-5 py-2.5 rounded-xl text-xs md:text-sm font-black text-white transition ${
                                    currentStep === 6 ? 'opacity-30 cursor-not-allowed bg-purple-400' : 'bg-gradient-to-r from-purple-600 to-indigo-600 hover:opacity-95 shadow-md'
                                }`}
                            >
                                다음 차시 →
                            </button>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot ? ReactDOM.createRoot(document.getElementById('root')) : null;
        if (root) {
            root.render(<App />);
        } else {
            ReactDOM.render(<App />, document.getElementById('root'));
        }
    </script>
</body>
</html>
